name: 全平台自动同步（微博每 2 小时 · 抖音/小红书/外网每 4 小时）

on:
  schedule:
    # 每 2 小时运行一次（北京时间 00:00 / 02:00 / 04:00 ...）
    # 微博每 2 小时同步；抖音、小红书、YouTube、IG、TikTok 在整 4 小时节点同步
    - cron: '0 */2 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点按钮立即全量同步

permissions:
  contents: write

jobs:
  sync-all:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 判断是否到达 4 小时全平台同步窗口
        id: window
        run: |
          HOUR=$((10#$(date -u +%H)))
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || (( HOUR % 4 == 0 )); then
            echo "run_platforms=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_platforms=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 【每 2 小时】同步微博官博、工作室与九人吧主最新动态
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          RSSHUB_BASE: ${{ secrets.RSSHUB_BASE }}
        run: |
          node tools/sync-weibo.mjs --no-build
          node tools/sync-offstage.mjs --weibo-only --no-build

      - name: 【每 4 小时】同步抖音、小红书、YouTube、IG 与 TikTok
        if: steps.window.outputs.run_platforms == 'true'
        env:
          RSSHUB_BASE: ${{ secrets.RSSHUB_BASE }}
          DOUYIN_API_BASE: ${{ secrets.DOUYIN_API_BASE }}
          XHS_API_BASE: ${{ secrets.XHS_API_BASE }}
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          WEVERSE_COOKIE: ${{ secrets.WEVERSE_COOKIE }}
        run: |
          node tools/sync-video.mjs
          node tools/sync-offstage.mjs --platforms --no-build
          node tools/sync-community.mjs

      - name: 重新编译全站静态数据与日历 (.ics)
        run: node tools/build.mjs

      - name: 自动提交更新后的 JSON 数据与日历 (.ics)
        run: |
          git config user.name "exoplanet-bot"
          git config user.email "bot@exolneverland.com"
          if [[ -n "$(git status --porcelain data/ site/data/ site/cal/ site/img/offstage/)" ]]; then
            git add data/ site/data/ site/cal/ site/img/offstage/
            git commit -m "chore(data): 自动同步近7天全平台动态与行程"
            git push
          else
            echo "本轮暂无新增动态"
          fi
