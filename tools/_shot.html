<!doctype html><style>body{margin:0}iframe{width:var(--w,1440px);height:900px;border:0;display:block}</style>
<iframe id="f"></iframe>
<script>const q=new URLSearchParams(location.search);if(q.get("w"))document.documentElement.style.setProperty("--w",q.get("w")+"px");f.src=q.get('src');f.onload=()=>setTimeout(()=>{const d=f.contentDocument,el=d.getElementById(q.get('to'));if(el){f.contentWindow.scrollTo(0,el.getBoundingClientRect().top+f.contentWindow.scrollY+(+q.get('dy')||0));d.querySelectorAll('.rv').forEach(n=>n.classList.add('is-in'));}},2500)</script>
