<!doctype html>
<meta charset="utf-8">
<base href="/">
<link rel="stylesheet" href="fonts/web/fonts.css?v=1">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f6f1e7; color: #1a2039; }
  body { position: relative; font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; }
  .grain { position: absolute; inset: 0; background: radial-gradient(900px 500px at 8% 0%, rgba(255,255,255,.7), transparent 70%); }
  .ph { position: absolute; right: 0; top: 0; width: 420px; height: 630px; overflow: hidden; }
  .ph img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; display: block; }
  .bar { position: absolute; right: 420px; top: 0; width: 14px; height: 630px; background: var(--mc); }
  .txt { position: absolute; left: 72px; top: 64px; width: 660px; bottom: 56px; display: flex; flex-direction: column; }
  .k { font: 500 22px/1 'Jost', sans-serif; letter-spacing: .3em; text-transform: uppercase; color: #5b6180; }
  .name { font: 500 150px/.95 'Cormorant Garamond', serif; letter-spacing: -.01em; margin: 44px 0 0 -6px; white-space: nowrap; }
  .real { font: 400 34px/1.3 'Noto Serif SC', serif; margin-top: 20px; color: #343a5a; }
  .pw { margin-top: auto; display: flex; align-items: baseline; gap: 18px; }
  .pw b { font: 600 78px/1 'Noto Serif SC', serif; color: var(--ac); }
  .pw span { font: 500 30px/1 'Jost', sans-serif; letter-spacing: .28em; color: var(--ac); }
  .dot { display: inline-block; width: 22px; height: 22px; border-radius: 50%; background: var(--mc); margin-right: 14px; vertical-align: -2px; box-shadow: 0 0 0 2px #f6f1e7, 0 0 0 3px rgba(26,32,57,.25); }
  .site { margin-top: 26px; font: 500 22px/1 'Jost', sans-serif; letter-spacing: .12em; color: #5b6180; }
  .cr { position: absolute; right: 436px; bottom: 18px; font: 400 14px/1 'Jost', sans-serif; color: #8a8fa8; }
  /* home */
  .grid { position: absolute; right: 0; top: 0; width: 630px; height: 630px; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); }
  .grid i { overflow: hidden; position: relative; }
  .grid img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; display: block; }
  .grid i::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: var(--c); }
  .hero { font: 300 128px/.9 'Cormorant Garamond', serif; letter-spacing: -.01em; text-transform: uppercase; margin: 40px 0 0 -6px; }
  .zh { font: 600 96px/1 'Noto Serif SC', serif; margin-top: 14px; }
  .sub { margin-top: auto; font: 400 28px/1.5 'Noto Serif SC', serif; color: #343a5a; }
  .dots { margin-top: 22px; }
</style>
<div class="grain"></div>
<div id="r"></div>
<script>
  const q = new URLSearchParams(location.search), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  fetch('data/members.json').then(r => r.json()).then(ms => {
    const ac = JSON.parse(q.get('ac') || '{}'), id = q.get('id'), m = ms.find(x => x.id === id);
    if (!m) { // home
      document.getElementById('r').innerHTML = `
        <div class="grid">${ms.map(x => `<i style="--c:${x.color}"><img src="${esc(x.photo2 || x.photo)}" alt=""></i>`).join('')}</div>
        <div class="txt" style="width:480px"><p class="k">Fan site · 粉丝自制</p><h1 class="hero">EXO<br><span style="font:600 100px/1.1 'Noto Serif SC',serif;letter-spacing:0">星球</span></h1><p class="sub">九个人，九种超能力。<br>成员 · 行程 · 专辑 · L 卡</p>
        <p class="dots">${ms.map(x => `<span class="dot" style="--mc:${x.color}"></span>`).join('')}</p><p class="site">exolneverland.com</p></div><p class="cr" style="right:650px">Photo © SM Entertainment</p>`;
    } else {
      document.body.style.setProperty('--mc', m.color); document.body.style.setProperty('--ac', ac[id] || '#1a2039');
      const fs = Math.min(150, 640 / (m.en.length * 0.66));
      document.getElementById('r').innerHTML = `
        <div class="ph"><img src="${esc(m.photo2 || m.photo)}" alt=""></div><div class="bar"></div>
        <div class="txt"><p class="k">EXO 星球 · 单人专栏</p><h1 class="name" style="font-size:${fs}px">${esc(m.en)}</h1>
        <p class="real">${esc(m.zh)} · ${esc(m.ko)}</p>
        <div class="pw"><b>${esc(m.power.zh)}</b><span>${esc(m.power.en)}</span></div><p class="site"><span class="dot"></span>exolneverland.com/m/${esc(m.id)}</p></div>
        <p class="cr">Photo © SM Entertainment</p>`;
    }
    document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {})))).then(() => document.documentElement.dataset.ready = '1');
  });
</script>
